name: Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RISC-V toolchain
        run: |
          archive=xpack-riscv-none-elf-gcc-12.5.0-1-linux-x64.tar.gz
          url=https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v12.5.0-1
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output "$archive" "$url/$archive"
          curl --fail --location --retry 3 --output "$archive.sha" "$url/$archive.sha"
          sha256sum --check "$archive.sha"
          tar -xzf "$archive"
          echo "$RUNNER_TEMP/xpack-riscv-none-elf-gcc-12.5.0-1/bin" >> "$GITHUB_PATH"

      - name: Build and validate 0055 firmware
        run: |
          version=$(python -c 'import pathlib, re; text = pathlib.Path("tooling/firmware-modules/native_version.h").read_text(); print(re.search(r"^#define AP01_MODIFIED_ROM_VERSION \"([0-9]+\.[0-9]+\.[0-9]+)\"$", text, re.M)[1])')
          python -B tooling/scripts/test-rom-target.py
          python -B tooling/scripts/build-firmware.py --target 0055 --build-dir build/release-base --output "dist/ap01-0055-base-${version}.bin" --tool-prefix riscv-none-elf-
          python -B tooling/scripts/test-firmware.py --manifest "dist/ap01-0055-base-${version}.manifest.json"
          python -B tooling/scripts/build-firmware.py --target 0055 --boot-app-v3 --build-dir build/release-app-platform --output "dist/ap01-0055-app-platform-${version}.bin" --tool-prefix riscv-none-elf-
          python -B tooling/scripts/test-firmware.py --manifest "dist/ap01-0055-app-platform-${version}.manifest.json"

      - name: Generate checksums
        working-directory: dist
        run: sha256sum ./* > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --generate-notes --notes '基于原厂 1.0.2_0055，包含无 App 基版和 ABI 3 App 加载平台。仅通过构建与离线校验，尚未完成实机验收。'
